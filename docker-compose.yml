# time, for example: docker compose --env-file .env.local up -d --build
# They are browser-visible NEXT_PUBLIC_ values; never add server secrets here.
services:
  lumix-front:
    image: lumix-front:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-3002}
        NEXT_PUBLIC_BLUX_APP_ID: ${NEXT_PUBLIC_BLUX_APP_ID}
        NEXT_PUBLIC_STELLAR_NETWORK: ${NEXT_PUBLIC_STELLAR_NETWORK:-testnet}
        NEXT_PUBLIC_STELLAR_HORIZON_URL: ${NEXT_PUBLIC_STELLAR_HORIZON_URL}
        NEXT_PUBLIC_STELLAR_RPC_URL: ${NEXT_PUBLIC_STELLAR_RPC_URL}
        NEXT_PUBLIC_STELLAR_MAINNET_RPC_URL: ${NEXT_PUBLIC_STELLAR_MAINNET_RPC_URL:-https://mainnet.sorobanrpc.com}
        NEXT_PUBLIC_STELLAR_EXPLORER_URL: ${NEXT_PUBLIC_STELLAR_EXPLORER_URL}
        NEXT_PUBLIC_STELLAR_USDC_ISSUER: ${NEXT_PUBLIC_STELLAR_USDC_ISSUER}
        NEXT_PUBLIC_STELLAR_USDC_SAC_ADDRESS: ${NEXT_PUBLIC_STELLAR_USDC_SAC_ADDRESS}
        NEXT_PUBLIC_STELLAR_OPTIONS_CONTRACT_ADDRESS: ${NEXT_PUBLIC_STELLAR_OPTIONS_CONTRACT_ADDRESS:-}
        NEXT_PUBLIC_STELLAR_PERPETUALS_CONTRACT_ADDRESS: ${NEXT_PUBLIC_STELLAR_PERPETUALS_CONTRACT_ADDRESS:-}
        NEXT_PUBLIC_PERPETUALS_PAYMENT_DESTINATION: ${NEXT_PUBLIC_PERPETUALS_PAYMENT_DESTINATION}
    environment:
      PORT: ${PORT:-3002}
      LUMIX_API_URL: ${LUMIX_API_URL:-}
      API_URL: ${API_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PORT:-3002}:${PORT:-3002}"
    restart: unless-stopped
